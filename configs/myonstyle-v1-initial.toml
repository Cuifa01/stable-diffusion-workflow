# Myonstyle v1 — first selected SDXL LoRA training configuration
# Recorded 2026-10-15 from the author's trainer configuration.
# Initial configuration snapshot, NOT evidence of a completed or successful training run.
# Model and dataset locations are supplied locally before execution.

model_train_type = "sdxl-lora"
pretrained_model_name_or_path = "SET_WAI_ILLUSTRIOUS_V15_CHECKPOINT_LOCALLY"
train_data_dir = "SET_DATASET_PARENT_DIRECTORY_LOCALLY"
prior_loss_weight = 1
resolution = "1024,1024"
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 2048
bucket_reso_steps = 64
bucket_no_upscale = true
output_name = "Myonstyle_v1"
output_dir = "./output"
save_model_as = "safetensors"
save_precision = "fp16"
save_every_n_epochs = 1
save_state = false
max_train_epochs = 5
train_batch_size = 1
gradient_checkpointing = true
gradient_accumulation_steps = 1
network_train_unet_only = true
network_train_text_encoder_only = false
learning_rate = 0.0001
unet_lr = 0.0001
text_encoder_lr = 0
lr_scheduler = "cosine"
lr_warmup_steps = 50
loss_type = "l2"
optimizer_type = "AdamW8bit"
min_snr_gamma = 5
network_module = "networks.lora"
network_dim = 32
network_alpha = 16
log_with = "tensorboard"
log_prefix = "Myonstyle_v1"
logging_dir = "./logs"
caption_extension = ".txt"
shuffle_caption = false
keep_tokens = 0
max_token_length = 255
caption_dropout_every_n_epochs = 0
caption_tag_dropout_rate = 0
color_aug = false
seed = 1337
mixed_precision = "bf16"
xformers = true
lowram = false
cache_latents = true
cache_latents_to_disk = true
cache_text_encoder_outputs = true
persistent_data_loader_workers = true
